name: Build Windows 10/11 Installers & Publish Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release tag name (e.g. v1.0.0) - leave blank to only build artifacts'
        required: false
        default: ''

jobs:
  build-windows-exe:
    name: Build Windows 10/11 (.exe)
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up MSVC Environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller nuitka

      - name: Compile Proprietary Modules with Nuitka (C++ Binary Protection)
        shell: pwsh
        env:
          PYTHONIOENCODING: "utf-8"
        run: |
          python scripts/compile_nuitka.py

      - name: Build Windows Executable
        run: pyinstaller MCOMaker.spec --clean

      - name: Build Windows Setup Installer (Inno Setup)
        shell: pwsh
        run: |
          $ver = "${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name || '1.0.0' }}".TrimStart("v")
          if (Test-Path "C:\Program Files (x86)\Inno Setup 6\iscc.exe") {
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          } elseif (Test-Path "C:\Program Files\Inno Setup 6\iscc.exe") {
              $isccPath = "C:\Program Files\Inno Setup 6\iscc.exe"
          } elseif (Get-Command iscc -ErrorAction SilentlyContinue) {
              $isccPath = (Get-Command iscc).Source
          } else {
              choco install innosetup --no-progress -y
              $isccPath = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          }
          & $isccPath "/DAppVersion=$ver" installer.iss

      - name: Upload Windows Setup Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MCOMaker-Windows-Setup
          path: dist/MCOMaker-Setup.exe

  release:
    name: Publish GitHub Release
    needs: [build-windows-exe]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure release notes exist
        shell: bash
        run: |
          if [ ! -f RELEASE_NOTES.md ]; then
            echo "# Release ${{ github.ref_name }}" > RELEASE_NOTES.md
            echo "Automated release build." >> RELEASE_NOTES.md
          fi

      - name: Download Windows Setup Installer Artifact
        uses: actions/download-artifact@v4
        with:
          name: MCOMaker-Windows-Setup
          path: release-assets/

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name }}
          files: |
            release-assets/MCOMaker-Setup.exe
          draft: false
          body_path: RELEASE_NOTES.md
          generate_release_notes: false

      - name: Broadcast Release Update to Vercel Licensing Server
        shell: bash
        run: |
          TAG="${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag_name }}"
          VER="${TAG#v}"
          echo "Broadcasting update for v${VER} to Vercel..."
          curl -s -X POST "https://mcomaker.vercel.app/api/admin/broadcast-update" \
            -H "Content-Type: application/json" \
            -H "x-admin-secret: TahirNaqash_Secret_2026" \
            -d "{\"admin_secret\":\"TahirNaqash_Secret_2026\",\"version\":\"$VER\",\"download_url\":\"https://github.com/naqasht128/MCOMaker/releases/download/$TAG/MCOMaker-Setup.exe\",\"file_name\":\"MCOMaker-Setup.exe\",\"release_notes\":\"Release $TAG\"}"
